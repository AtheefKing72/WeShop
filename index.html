<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WeShop - Print-on-Demand Store</title>
    <script src="https://www.paypal.com/sdk/js?client-id=BAAQnnBqqFcv6UFedRqZxhuc2vSTteXDmx_8OBX0YcOj9OjhX0NIPu-ibCZ8Brk7mD7gFsOwMKRo7bddzo&currency=USD"></script>
    <style>
        :root {
            --bg-glass: rgba(20, 20, 30, 0.65);
            --border-glass: rgba(255, 255, 255, 0.12);
            --accent-gold: #ffb703;
            --accent-gradient: linear-gradient(135deg, #ffb703, #fb8500);
            --text-main: #f8f9fa;
            --text-sub: #a0aab8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #0d0f12;
            color: var(--text-main);
            min-height: 100vh;
            padding-bottom: 60px;
        }

        header {
            background: rgba(13, 15, 18, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-glass);
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 800;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 30px;
        }

        .product-card {
            background: var(--bg-glass);
            border: 1px solid var(--border-glass);
            border-radius: 16px;
            padding: 20px;
            backdrop-filter: blur(10px);
            transition: transform 0.3s ease, border-color 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .product-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent-gold);
        }

        .image-container {
            width: 100%;
            height: 320px;
            border-radius: 12px;
            overflow: hidden;
            background: #15181e;
            position: relative;
            margin-bottom: 16px;
        }

        .main-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: opacity 0.3s ease;
        }

        .thumbnails {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }

        .thumb {
            width: 50px;
            height: 50px;
            border-radius: 8px;
            object-fit: cover;
            cursor: pointer;
            border: 2px solid transparent;
            opacity: 0.7;
            transition: all 0.2s ease;
        }

        .thumb.active, .thumb:hover {
            border-color: var(--accent-gold);
            opacity: 1;
        }

        .product-title {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .product-price {
            font-size: 1.4rem;
            color: var(--accent-gold);
            font-weight: 800;
            margin-bottom: 16px;
        }

        .selectors {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }

        select {
            flex: 1;
            padding: 10px;
            background: #1c2029;
            color: #fff;
            border: 1px solid var(--border-glass);
            border-radius: 8px;
            outline: none;
            cursor: pointer;
        }

        .btn-buy {
            width: 100%;
            padding: 14px;
            background: var(--accent-gradient);
            color: #000;
            font-weight: 700;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: opacity 0.2s ease;
            margin-top: auto;
        }

        .btn-buy:hover {
            opacity: 0.9;
        }

        /* Modal / Checkout Drawer */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(8px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: #14171d;
            border: 1px solid var(--border-glass);
            border-radius: 16px;
            padding: 30px;
            width: 100%;
            max-width: 480px;
            position: relative;
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            color: var(--text-sub);
            font-size: 1.5rem;
            cursor: pointer;
        }

        .form-group {
            margin-bottom: 14px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-sub);
            margin-bottom: 6px;
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            background: #1c2029;
            border: 1px solid var(--border-glass);
            border-radius: 8px;
            color: #fff;
            outline: none;
        }

        #paypal-button-container {
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">WeShop</div>
    </header>

    <div class="container">
        <div class="product-grid" id="grid">
            <!-- Product Card -->
            <div class="product-card">
                <div class="image-container">
                    <img id="main-img" class="main-image" src=""C:\Users\moham\Downloads\Person 1 Front.png" alt="Black Friday T-Shirt Front">
                </div>
                <div class="thumbnails">
                    <img class="thumb active" src=""C:\Users\moham\Downloads\Person 1 Front.png"" onclick="switchImg(this, 'Front.png')" alt="Front">
                    <img class="thumb" src="Back.png" onclick="switchImg(this, 'Back.png')" alt="Back">
                    <img class="thumb" src="Person 1 Front.png" onclick="switchImg(this, 'Person 1 Front.png')" alt="Model">
                    <img class="thumb" src="Folded.png" onclick="switchImg(this, 'Folded.png')" alt="Folded">
                </div>
                <h3 class="product-title">Black Friday Classic Tee</h3>
                <div class="product-price">$45.00</div>
                
                <div class="selectors">
                    <select id="size">
                        <option value="S">Size: S</option>
                        <option value="M">Size: M</option>
                        <option value="L" selected>Size: L</option>
                        <option value="XL">Size: XL</option>
                        <option value="2XL">Size: 2XL</option>
                    </select>
                    <select id="color">
                        <option value="Black">Color: Black</option>
                    </select>
                </div>

                <button class="btn-buy" onclick="openCheckout('Black Friday Classic Tee', 45.00)">Buy Now</button>
            </div>
        </div>
    </div>

    <!-- Checkout Modal -->
    <div class="modal-overlay" id="checkout-modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeCheckout()">&times;</span>
            <h3 style="margin-bottom: 20px;" id="modal-product-title">Complete Checkout</h3>
            
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="cust-name" placeholder="John Doe" required>
            </div>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="cust-email" placeholder="john@example.com" required>
            </div>
            <div class="form-group">
                <label>Phone Number</label>
                <input type="tel" id="cust-phone" placeholder="+1 234 567 8900" required>
            </div>
            <div class="form-group">
                <label>Delivery Address</label>
                <input type="text" id="cust-address" placeholder="123 Main St, City, Country" required>
            </div>

            <div id="paypal-button-container"></div>
        </div>
    </div>

    <script>
        let currentItem = { name: '', price: 0 };

        function switchImg(thumbEl, src) {
            document.getElementById('main-img').src = src;
            document.querySelectorAll('.thumb').forEach(t => t.classList.remove('active'));
            thumbEl.classList.add('active');
        }

        function openCheckout(name, price) {
            currentItem = { name, price };
            document.getElementById('modal-product-title').innerText = `Buy ${name} ($${price.toFixed(2)})`;
            document.getElementById('checkout-modal').style.display = 'flex';
            
            // Clear existing buttons if any
            document.getElementById('paypal-button-container').innerHTML = '';

            if (typeof paypal !== 'undefined') {
                paypal.Buttons({
                    createOrder: function(data, actions) {
                        const nameVal = document.getElementById('cust-name').value;
                        const addressVal = document.getElementById('cust-address').value;
                        
                        if (!nameVal || !addressVal) {
                            alert('Please fill out all delivery fields before proceeding.');
                            return actions.reject();
                        }

                        return actions.order.create({
                            purchase_units: [{
                                amount: {
                                    value: currentItem.price.toString()
                                },
                                payee: {
                                    email_address: "atheef0913@gmail.com"
                                },
                                description: `${currentItem.name} - WeShop Store`
                            }]
                        });
                    },
                    onApprove: function(data, actions) {
                        return actions.order.capture().then(function(details) {
                            alert('Transaction completed by ' + details.payer.name.given_name + '! Funds sent to atheef0913@gmail.com.');
                            closeCheckout();
                        });
                    }
                }).render('#paypal-button-container');
            }
        }

        function closeCheckout() {
            document.getElementById('checkout-modal').style.display = 'none';
        }
    </script>
</body>
</html>
