<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WeShop | Premium Print-on-Demand</title>
    <!-- PayPal SDK -->
    <script src="https://www.paypal.com/sdk/js?client-id=BAAQnnBqqFcv6UFedRqZxhuc2vSTteXDmx_8OBX0YcOj9OjhX0NIPu-ibCZ8Brk7mD7gFsOwMKRo7bddzo&currency=USD"></script>
    <style>
        :root {
            --bg-main: #0a0c10;
            --bg-card: rgba(22, 27, 34, 0.75);
            --border-glass: rgba(255, 255, 255, 0.1);
            --border-hover: #ffb703;
            --accent-gold: #ffb703;
            --accent-gradient: linear-gradient(135deg, #ffb703, #fb8500);
            --text-primary: #f0f6fc;
            --text-secondary: #8b949e;
            --error-red: #ff7b72;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: rgba(13, 17, 23, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-glass);
            padding: 14px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 900;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
        }

        .tagline {
            font-size: 0.8rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        main {
            flex: 1;
            max-width: 1200px;
            width: 100%;
            margin: 20px auto;
            padding: 0 16px;
        }

        .section-title {
            font-size: 1.3rem;
            margin-bottom: 20px;
            font-weight: 700;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .product-card {
            background: var(--bg-card);
            border: 1px solid var(--border-glass);
            border-radius: 16px;
            padding: 16px;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            display: flex;
            flex-direction: column;
        }

        .image-container {
            width: 100%;
            height: 280px;
            border-radius: 12px;
            overflow: hidden;
            background: #161b22;
            position: relative;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .main-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .thumbnails {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            overflow-x: auto;
            padding-bottom: 4px;
        }

        .thumb {
            width: 50px;
            height: 50px;
            flex-shrink: 0;
            border-radius: 8px;
            object-fit: cover;
            cursor: pointer;
            border: 2px solid var(--border-glass);
            opacity: 0.6;
            transition: all 0.2s ease;
            background: #161b22;
        }

        .thumb.active, .thumb:hover {
            border-color: var(--accent-gold);
            opacity: 1;
        }

        .product-info {
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .product-title {
            font-size: 1.15rem;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .product-price {
            font-size: 1.35rem;
            color: var(--accent-gold);
            font-weight: 800;
            margin-bottom: 14px;
        }

        .selector-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 16px;
        }

        select {
            width: 100%;
            padding: 10px;
            background: #0d1117;
            color: var(--text-primary);
            border: 1px solid var(--border-glass);
            border-radius: 8px;
            outline: none;
            cursor: pointer;
            font-size: 0.85rem;
        }

        .btn-buy {
            width: 100%;
            padding: 14px;
            background: var(--accent-gradient);
            color: #000;
            font-weight: 800;
            font-size: 0.9rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: auto;
        }

        /* Mobile Responsive Modal Drawer */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            display: none;
            justify-content: center;
            align-items: flex-end; /* Slides up naturally on mobile */
            z-index: 1000;
            padding: 0;
        }

        .modal-content {
            background: #161b22;
            border-top: 1px solid var(--border-glass);
            border-radius: 20px 20px 0 0;
            padding: 24px 20px;
            width: 100%;
            max-width: 500px;
            max-height: 90vh; /* Prevents overflow off screen */
            overflow-y: auto; /* Enables vertical scrolling */
            position: relative;
            box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.7);
        }

        @media (min-width: 600px) {
            .modal-overlay {
                align-items: center;
                padding: 20px;
            }
            .modal-content {
                border: 1px solid var(--border-glass);
                border-radius: 20px;
                max-height: 85vh;
            }
        }

        .close-btn {
            position: absolute;
            top: 16px;
            right: 20px;
            color: var(--text-secondary);
            font-size: 1.6rem;
            cursor: pointer;
            line-height: 1;
        }

        .modal-header {
            margin-bottom: 18px;
            padding-right: 30px;
        }

        .modal-header h3 {
            font-size: 1.2rem;
            font-weight: 700;
        }

        .modal-header p {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }

        .form-group input {
            width: 100%;
            padding: 10px 12px;
            background: #0d1117;
            border: 1px solid var(--border-glass);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 0.9rem;
            outline: none;
        }

        #paypal-button-container {
            margin-top: 18px;
            min-height: 150px;
            width: 100%;
        }

        footer {
            border-top: 1px solid var(--border-glass);
            padding: 18px;
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">WeShop</div>
        <div class="tagline">Exclusive Apparel</div>
    </header>

    <main>
        <h2 class="section-title">Featured Drop</h2>
        
        <div class="product-grid">
            <div class="product-card">
                <div class="image-container">
                    <img id="main-product-img" class="main-image" src="Front.png" alt="Black Friday Classic Tee">
                </div>
                
                <div class="thumbnails">
                    <img class="thumb active" src="Front.png" onclick="switchImage(this, 'Front.png')" alt="Front View">
                    <img class="thumb" src="Back.png" onclick="switchImage(this, 'Back.png')" alt="Back View">
                    <img class="thumb" src="Person 1 Front.png" onclick="switchImage(this, 'Person 1 Front.png')" alt="Model View">
                    <img class="thumb" src="Folded.png" onclick="switchImage(this, 'Folded.png')" alt="Folded View">
                </div>

                <div class="product-info">
                    <h3 class="product-title">Black Friday Classic Tee</h3>
                    <div class="product-price">$45.00</div>
                    
                    <div class="selector-group">
                        <div>
                            <select id="selected-size">
                                <option value="S">Size: S</option>
                                <option value="M">Size: M</option>
                                <option value="L" selected>Size: L</option>
                                <option value="XL">Size: XL</option>
                                <option value="2XL">Size: 2XL</option>
                            </select>
                        </div>
                        <div>
                            <select id="selected-color">
                                <option value="Black">Color: Black</option>
                            </select>
                        </div>
                    </div>

                    <button class="btn-buy" onclick="initiateCheckout()">Buy Now</button>
                </div>
            </div>
        </div>
    </main>

    <!-- Mobile-Optimized Modal -->
    <div class="modal-overlay" id="checkout-modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeCheckout()">&times;</span>
            <div class="modal-header">
                <h3 id="modal-title">Shipping Details</h3>
                <p id="modal-subtitle">Fill shipping info to reveal PayPal buttons</p>
            </div>
            
            <form id="shipping-form" onsubmit="return false;">
                <div class="form-group">
                    <label for="cust-name">Full Name *</label>
                    <input type="text" id="cust-name" placeholder="John Doe" required>
                </div>
                <div class="form-group">
                    <label for="cust-email">Email Address *</label>
                    <input type="email" id="cust-email" placeholder="john@example.com" required>
                </div>
                <div class="form-group">
                    <label for="cust-phone">Phone Number *</label>
                    <input type="tel" id="cust-phone" placeholder="+1 234 567 8900" required>
                </div>
                <div class="form-group">
                    <label for="cust-address">Delivery Address *</label>
                    <input type="text" id="cust-address" placeholder="123 Main St, City, Country" required>
                </div>
            </form>

            <div id="paypal-button-container"></div>
        </div>
    </div>

    <footer>
        &copy; WeShop. Express Checkout via PayPal.
    </footer>

    <script>
        const itemConfig = {
            name: "Black Friday Classic Tee",
            price: 45.00,
            merchantEmail: "atheef0913@gmail.com"
        };

        function switchImage(thumbElement, imageSrc) {
            document.getElementById('main-product-img').src = imageSrc;
            document.querySelectorAll('.thumb').forEach(t => t.classList.remove('active'));
            thumbElement.classList.add('active');
        }

        function initiateCheckout() {
            const size = document.getElementById('selected-size').value;
            const color = document.getElementById('selected-color').value;
            
            document.getElementById('modal-title').innerText = `Checkout (${size} / ${color})`;
            document.getElementById('modal-subtitle').innerText = `${itemConfig.name} - $${itemConfig.price.toFixed(2)}`;
            document.getElementById('checkout-modal').style.display = 'flex';
            
            renderPayPalButtons();
        }

        function closeCheckout() {
            document.getElementById('checkout-modal').style.display = 'none';
        }

        function validateForm() {
            const name = document.getElementById('cust-name').value.trim();
            const email = document.getElementById('cust-email').value.trim();
            const phone = document.getElementById('cust-phone').value.trim();
            const address = document.getElementById('cust-address').value.trim();
            
            return name !== '' && email !== '' && phone !== '' && address !== '';
        }

        function renderPayPalButtons() {
            const container = document.getElementById('paypal-button-container');
            container.innerHTML = '';

            if (typeof paypal === 'undefined') {
                container.innerHTML = '<p style="color:var(--error-red); text-align:center;">PayPal SDK failed to load.</p>';
                return;
            }

            paypal.Buttons({
                style: {
                    layout: 'vertical',
                    color:  'gold',
                    shape:  'rect',
                    label:  'paypal'
                },
                onClick: function(data, actions) {
                    if (!validateForm()) {
                        alert('Please fill out all contact and shipping details above first.');
                        return actions.reject();
                    }
                    return actions.resolve();
                },
                createOrder: function(data, actions) {
                    const size = document.getElementById('selected-size').value;
                    const color = document.getElementById('selected-color').value;
                    const custName = document.getElementById('cust-name').value.trim();

                    return actions.order.create({
                        purchase_units: [{
                            amount: {
                                value: itemConfig.price.toFixed(2),
                                currency_code: "USD"
                            },
                            payee: {
                                email_address: itemConfig.merchantEmail
                            },
                            description: `${itemConfig.name} (${size}/${color}) - Customer: ${custName}`
                        }]
                    });
                },
                onApprove: function(data, actions) {
                    return actions.order.capture().then(function(details) {
                        alert(`Thank you for your order, ${details.payer.name.given_name}! Payments received at ${itemConfig.merchantEmail}.`);
                        closeCheckout();
                    });
                }
            }).render('#paypal-button-container');
        }

        window.onclick = function(event) {
            const modal = document.getElementById('checkout-modal');
            if (event.target === modal) {
                closeCheckout();
            }
        };
    </script>
</body>
</html>
